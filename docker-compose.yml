version: '3.9'

services:
  # ─── Base de Datos ───────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: asistencia_db
    restart: unless-stopped
    environment:
      # Sin defaults inseguros: el arranque falla si el secreto no está definido.
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD requerido}
      MYSQL_DATABASE: ${DB_NAME:-asistencia}
      MYSQL_USER: ${DB_USER:-asistencia_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD requerido}
    ports:
      # Solo loopback: la BD no debe quedar expuesta en la interfaz pública.
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - asistencia_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis (Pub/Sub + Cache) ──────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: asistencia_redis
    restart: unless-stopped
    ports:
      # Solo loopback + contraseña obligatoria: Redis nunca expuesto en abierto.
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - asistencia_net
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD requerido}"]

  # ─── Core API (Node.js/Express) ───────────────────────────────
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: asistencia_api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 4000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-asistencia}
      DB_USER: ${DB_USER:-asistencia_user}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD requerido}
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD requerido}@redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET requerido}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET requerido}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    ports:
      - "127.0.0.1:4000:4000"
    networks:
      - asistencia_net

  # ─── ZKTeco Bridge Service ─────────────────────────────────────
  bridge:
    build:
      context: ./bridge
      dockerfile: Dockerfile
    container_name: asistencia_bridge
    restart: unless-stopped
    depends_on:
      - redis
      - api
    environment:
      NODE_ENV: production
      # network_mode: host → Redis se alcanza por loopback, con contraseña.
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD requerido}@127.0.0.1:6379
      API_URL: http://api:4000
      API_KEY: ${BRIDGE_API_KEY:?BRIDGE_API_KEY requerido}
      ZKTECO_POLL_INTERVAL: 30000
    ports:
      - "8080:8080"   # Puerto para recibir PUSH del reloj ZKTeco
    network_mode: host  # Necesario para acceder a relojes en LAN
    # NOTA: Si usas network_mode: host, no aplica 'networks'

  # ─── Analytics Service (Python/FastAPI) ───────────────────────
  analytics:
    build:
      context: ./analytics
      dockerfile: Dockerfile
    container_name: asistencia_analytics
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-asistencia}
      DB_USER: ${DB_USER:-asistencia_user}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD requerido}
      API_KEY: ${ANALYTICS_API_KEY:?ANALYTICS_API_KEY requerido}
    ports:
      # Solo loopback: analytics se consume vía la API/Nginx, no directo.
      - "127.0.0.1:5000:5000"
    networks:
      - asistencia_net

  # ─── Dashboard Web (Next.js) ───────────────────────────────────
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: asistencia_web
    restart: unless-stopped
    depends_on:
      - api
      - analytics
    environment:
      NEXT_PUBLIC_API_URL: ${API_URL:-http://localhost:4000}
      NEXT_PUBLIC_ANALYTICS_URL: ${ANALYTICS_URL:-http://localhost:5000}
      NEXT_PUBLIC_SOCKET_URL: ${SOCKET_URL:-http://localhost:4000}
    ports:
      - "3000:3000"
    networks:
      - asistencia_net

  # ─── Nginx (Reverse Proxy) ─────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: asistencia_nginx
    restart: unless-stopped
    depends_on:
      - api
      - web
      - analytics
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      - asistencia_net

volumes:
  mysql_data:
  redis_data:

networks:
  asistencia_net:
    driver: bridge
