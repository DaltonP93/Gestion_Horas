version: '3.9'

services:
  # ─── Base de Datos ───────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: asistencia_db
    restart: unless-stopped
    environment:
      # Sin defaults inseguros: el arranque falla si el secreto no está definido.
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD requerido}
      MYSQL_DATABASE: ${DB_NAME:-asistencia}
      MYSQL_USER: ${DB_USER:-asistencia_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD requerido}
    ports:
      # Solo loopback: la BD no debe quedar expuesta en la interfaz pública.
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - asistencia_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis (Pub/Sub + Cache) ──────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: asistencia_redis
    restart: unless-stopped
    ports:
      # Solo loopback + contraseña obligatoria: Redis nunca expuesto en abierto.
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - asistencia_net
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD requerido}"]

  # ─── Core API (Node.js/Express) ───────────────────────────────
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: asistencia_api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 4000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-asistencia}
      DB_USER: ${DB_USER:-asistencia_user}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD requerido}
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD requerido}@redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET requerido}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET requerido}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      # Claves de servicios internos: la validación de entorno (config/env.js)
      # las exige en producción, y la API las usa para hablar con el bridge y
      # para el proxy BFF de Analytics.
      BRIDGE_API_KEY: ${BRIDGE_API_KEY:?BRIDGE_API_KEY requerido}
      ANALYTICS_API_KEY: ${ANALYTICS_API_KEY:?ANALYTICS_API_KEY requerido}
      ANALYTICS_URL: ${ANALYTICS_URL:-http://analytics:5000}
      BRIDGE_URL: ${BRIDGE_URL:-http://localhost:8081}
    ports:
      - "127.0.0.1:4000:4000"
    networks:
      - asistencia_net

  # ─── ZKTeco Bridge Service ─────────────────────────────────────
  bridge:
    build:
      context: ./bridge
      dockerfile: Dockerfile
    container_name: asistencia_bridge
    restart: unless-stopped
    depends_on:
      - redis
      - api
    environment:
      NODE_ENV: production
      # network_mode: host → Redis se alcanza por loopback, con contraseña.
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD requerido}@127.0.0.1:6379
      API_URL: http://api:4000
      API_KEY: ${BRIDGE_API_KEY:?BRIDGE_API_KEY requerido}
      BRIDGE_API_KEY: ${BRIDGE_API_KEY:?BRIDGE_API_KEY requerido}
      ZKTECO_POLL_INTERVAL: 30000
      # Relojes del Bridge. El Dockerfile sólo copia package*.json y src/, así
      # que `bridge/.env` NUNCA llega al contenedor: en Docker la única forma
      # de configurar relojes es reenviar la variable desde el .env raíz.
      # Sin esto, un despliegue Docker arranca con cero relojes.
      # Formato: [nombre@]host[:puerto][#serial], separados por coma. Ej:
      #   ZKTECO_DEVICES=Gerencia@10.0.0.11:4370,Comedor@10.0.0.12:4370
      ZKTECO_DEVICES: ${ZKTECO_DEVICES:?ZKTECO_DEVICES requerido — ver bridge/.env.example}
    ports:
      - "8080:8080"   # Puerto para recibir PUSH del reloj ZKTeco
    network_mode: host  # Necesario para acceder a relojes en LAN
    # NOTA: Si usas network_mode: host, no aplica 'networks'

  # ─── Analytics Service (Python/FastAPI) ───────────────────────
  analytics:
    build:
      context: ./analytics
      dockerfile: Dockerfile
    container_name: asistencia_analytics
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-asistencia}
      DB_USER: ${DB_USER:-asistencia_user}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD requerido}
      API_KEY: ${ANALYTICS_API_KEY:?ANALYTICS_API_KEY requerido}
    ports:
      # Solo loopback: analytics se consume vía la API/Nginx, no directo.
      - "127.0.0.1:5000:5000"
    networks:
      - asistencia_net

  # ─── Dashboard Web (Next.js) ───────────────────────────────────
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: asistencia_web
    restart: unless-stopped
    depends_on:
      - api
      - analytics
    environment:
      NEXT_PUBLIC_API_URL: ${API_URL:-http://localhost:4000}
      NEXT_PUBLIC_ANALYTICS_URL: ${ANALYTICS_URL:-http://localhost:5000}
      NEXT_PUBLIC_SOCKET_URL: ${SOCKET_URL:-http://localhost:4000}
    ports:
      - "3000:3000"
    networks:
      - asistencia_net

  # ─── Nginx (Reverse Proxy) ─────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: asistencia_nginx
    restart: unless-stopped
    depends_on:
      - api
      - web
      - analytics
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      - asistencia_net

volumes:
  mysql_data:
  redis_data:

networks:
  asistencia_net:
    driver: bridge
