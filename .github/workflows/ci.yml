name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
    branches: [main, 'claude/**']

# Cancela runs redundantes del mismo branch/PR cuando llega un push nuevo,
# para no acumular ejecuciones obsoletas en la cola.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bridge-tests:
    name: Bridge — tests (TZ=${{ matrix.tz }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridge
    strategy:
      # Tres zonas, no una. El Bridge convierte hora de pared del reloj a
      # instantes, así que la zona del proceso es una entrada real: un runner
      # en UTC no ejerce el caso de producción (America/Asuncion, UTC-4/-3) ni
      # el del otro lado del meridiano, donde la fecha local ya cambió.
      # fail-fast:false para que un fallo en una zona no oculte el resultado
      # de las otras dos.
      fail-fast: false
      matrix:
        tz: [UTC, America/Asuncion, Asia/Tokyo]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: bridge/package-lock.json
      - run: npm ci || npm install
      - name: npm audit (nivel alto)
        run: npm audit --audit-level=high
      - name: Unit tests
        run: npm test
        env:
          TZ: ${{ matrix.tz }}

  api-build:
    name: API — install + syntax (TZ=${{ matrix.tz }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    strategy:
      fail-fast: false
      matrix:
        tz: [UTC, America/Asuncion, Asia/Tokyo]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: api/package-lock.json
      - run: npm ci || npm install
      - name: npm audit (nivel alto)
        run: npm audit --audit-level=high
      - name: Syntax check
        run: node --check src/index.js
      - name: Unit tests
        run: npm test
        env:
          TZ: ${{ matrix.tz }}

  web-build:
    name: Web — build Next.js
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - run: npm ci || npm install
      - name: npm audit (nivel alto)
        run: npm audit --audit-level=high
      - name: Unit tests
        run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  analytics-build:
    name: Analytics — install + syntax
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analytics
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: pip install --no-cache-dir -r requirements.txt
      - name: Sintaxis (py_compile)
        run: python -m py_compile main.py
      - name: Import de la app (sin conectar a datos reales)
        # create_engine() es perezoso: no abre conexión hasta el primer query,
        # así que importar el módulo valida que la app arma sin tocar MySQL ni
        # att2000. No se ejecuta uvicorn ni se llama a ningún endpoint.
        run: python -c "import main; assert main.app"

  migrations:
    name: DB — migraciones (MySQL 8 efímero)
    runs-on: ubuntu-latest
    # Servicio MySQL descartable del propio job de CI — vive y muere con el
    # job. NUNCA es att2000 (SQL Server, fuente real read-only) ni la MySQL
    # de un entorno real: no hay credenciales ni datos reales acá.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_root_pass
          MYSQL_DATABASE: asistencia
          MYSQL_USER: asistencia_ci
          MYSQL_PASSWORD: ci_pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: api
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: asistencia
      DB_USER: asistencia_ci
      DB_PASSWORD: ci_pass
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: api/package-lock.json
      - run: npm ci || npm install
      - name: Cliente mysql disponible
        # ubuntu-latest ya lo trae; se instala sólo si faltara, para no
        # depender silenciosamente de que la imagen del runner no cambie.
        run: mysql --version || (sudo apt-get update && sudo apt-get install -y mysql-client)

      - name: Esquema base (database/init.sql)
        run: mysql -h127.0.0.1 -P3306 -uroot -pci_root_pass asistencia < ../database/init.sql

      # La migración 073 crea una función/trigger. Con binary logging activo
      # (default de MySQL 8), crear rutinas exige SUPER o este flag. El runner
      # de migraciones corre como asistencia_ci (sin SUPER), así que lo
      # habilitamos aquí como root. No afecta att2000 (BD efímera descartable).
      - name: Permitir creación de rutinas con binlog activo
        run: mysql -h127.0.0.1 -P3306 -uroot -pci_root_pass -e "SET GLOBAL log_bin_trust_function_creators = 1;"

      - name: migrate --status ANTES de aplicar — debe ser read-only
        run: |
          set -e
          OUT=$(node scripts/migrate.js --status)
          echo "$OUT"
          # Sobre una BD recién creada (sólo init.sql), la tabla de control
          # schema_migrations todavía no existe. --status no debe crearla.
          echo "$OUT" | grep -q "schema_migrations no existe" || (echo "❌ --status no reportó el caso read-only esperado" && exit 1)
          COUNT=$(mysql -h127.0.0.1 -P3306 -uroot -pci_root_pass -N -e \
            "SELECT COUNT(*) FROM INFORMATION_SCHEMA.TABLES WHERE TABLE_SCHEMA='asistencia' AND TABLE_NAME='schema_migrations'")
          if [ "$COUNT" != "0" ]; then
            echo "❌ --status creó schema_migrations (dejó de ser read-only)"; exit 1
          fi

      - name: Aplicar migraciones pendientes (incluye la 020 corregida)
        run: node scripts/migrate.js

      - name: Migración 020 es idempotente si se reaplica directo con mysql
        # Prueba puntual del fix del hallazgo #1: reejecutar el archivo tal
        # cual (fuera del runner, como en una recuperación manual) no debe
        # fallar sobre un esquema donde la tabla y las columnas ya existen.
        run: mysql -h127.0.0.1 -P3306 -uroot -pci_root_pass asistencia < ../database/migrations/020_webhooks_format.sql

      - name: webhooks quedó con la forma esperada
        run: |
          mysql -h127.0.0.1 -P3306 -uroot -pci_root_pass -N -e \
            "SELECT COLUMN_NAME FROM INFORMATION_SCHEMA.COLUMNS WHERE TABLE_SCHEMA='asistencia' AND TABLE_NAME='webhooks' ORDER BY COLUMN_NAME" \
            | tee /tmp/webhooks_cols.txt
          for col in format channel events url; do
            grep -qx "$col" /tmp/webhooks_cols.txt || (echo "❌ falta columna $col en webhooks" && exit 1)
          done

      - name: Migración 084 idempotente + forma de consola FASE E reconciliada
        # [R5-4] 084 reconcilia la forma de las tablas de la consola. Reejecutarla
        # directo (como en una recuperación manual) no debe fallar (idempotente), y
        # la forma exigida por el GO/NO-GO (rows_skipped + ENUM restored_with_conflicts
        # + applied_json + heartbeat_seq) debe estar presente.
        run: |
          set -e
          mysql -h127.0.0.1 -P3306 -uroot -pci_root_pass asistencia < ../database/migrations/084_fase_e_console_shape_reconcile.sql
          mysql -h127.0.0.1 -P3306 -uroot -pci_root_pass asistencia < ../database/migrations/084_fase_e_console_shape_reconcile.sql
          ENUMT=$(mysql -h127.0.0.1 -P3306 -uroot -pci_root_pass -N -e \
            "SELECT COLUMN_TYPE FROM INFORMATION_SCHEMA.COLUMNS WHERE TABLE_SCHEMA='asistencia' AND TABLE_NAME='daily_summary_recalc_batch' AND COLUMN_NAME='status'")
          echo "status ENUM: $ENUMT"
          echo "$ENUMT" | grep -q "restored_with_conflicts" || (echo "❌ falta el estado restored_with_conflicts" && exit 1)
          for pair in "daily_summary_recalc_batch:rows_skipped" "daily_summary_backup:applied_json" "fase_e_console_lock:heartbeat_seq"; do
            T="${pair%%:*}"; C="${pair##*:}"
            N=$(mysql -h127.0.0.1 -P3306 -uroot -pci_root_pass -N -e \
              "SELECT COUNT(*) FROM INFORMATION_SCHEMA.COLUMNS WHERE TABLE_SCHEMA='asistencia' AND TABLE_NAME='$T' AND COLUMN_NAME='$C'")
            [ "$N" = "1" ] || (echo "❌ falta $T.$C tras 084" && exit 1)
          done
          UQ=$(mysql -h127.0.0.1 -P3306 -uroot -pci_root_pass -N -e \
            "SELECT COUNT(*) FROM INFORMATION_SCHEMA.STATISTICS WHERE TABLE_SCHEMA='asistencia' AND TABLE_NAME='daily_summary_backup' AND INDEX_NAME='uq_batch_cell'")
          [ "$UQ" -ge "1" ] || (echo "❌ falta el índice único uq_batch_cell" && exit 1)

      - name: Reaplicar migrate = no-op (idempotencia del runner completo)
        run: |
          set -e
          OUT=$(node scripts/migrate.js)
          echo "$OUT"
          echo "$OUT" | grep -q "Nada por aplicar" || (echo "❌ la segunda corrida no fue no-op" && exit 1)

      - name: migrate --status DESPUÉS de aplicar — sigue siendo read-only
        run: |
          set -e
          OUT=$(node scripts/migrate.js --status)
          echo "$OUT"
          echo "$OUT" | grep -qE '0 pendientes' || (echo "❌ quedaron migraciones pendientes" && exit 1)

      # IT REALES de la consola FASE E contra este MySQL 8 efímero (esquema
      # completo + schema_migrations poblado por el runner). Ejercen recalcApply/
      # restoreBatch COMPLETOS con BARRERAS deterministas: [B1] co-lock por fecha +
      # FOR UPDATE (mutación tras el digest → PLAN_CHANGED; writer concurrente
      # serializado, sin pisar), [B2] fencing DB-side del lease (robo durante apply
      # y a mitad del restore → LOCK_LOST + rollback total, sin liberar al nuevo
      # dueño), backup atómico (fallo inyectado → rollback total), [B3] target
      # EFECTIVO (justificación preservada) y [B4] conteos reales insert/update/
      # delete/unchanged. [R5-1] fence ATÓMICO in-tx: lease vencido con token sin
      # cambiar → LEASE_EXPIRED (per-cell e in-tx) y robo tras el último fence externo
      # antes del commit (beforeFinalFence) → LOCK_LOST + rollback total (sin ventana).
      # [R5-2] cota de celdas fail-closed (por encima → TOO_MANY_CELLS sin escribir; en
      # el umbral → aplica). [R5-3] restore con cambio concurrente → restored_with_conflicts
      # + rows_skipped persistido. Todo con BARRERAS deterministas (sin sleeps en los
      # casos críticos). Sin IT_DB=1 estas suites se saltan.
      - name: IT reales FASE E (IT_DB=1, MySQL 8 efímero)
        run: npx jest tests/it/faseEConsole.it.test.js --runInBand
        env:
          IT_DB: '1'
          FASE_E_LOCK_LEASE_SEC: '3'

  # Idempotencia REAL de 072→075: la otra job las BASELINEA (marca aplicadas sin
  # ejecutarlas), así que su SQL nunca corre. Acá se BASELINEA hasta 071 y el
  # runner aplica 072→ de verdad; luego se reaplica y se compara el esquema
  # columna por columna para probar que una segunda pasada es un no-op exacto.
  migrations-072-075-idempotency:
    name: Idempotencia migraciones 072→075 (MySQL efímero)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: asistencia
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: asistencia
      MYSQL_PWD: root
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: api/package-lock.json
      - run: npm ci || npm install
      - name: Asegurar cliente mysql
        run: |
          if mysql --version >/dev/null 2>&1; then
            echo "cliente mysql presente"
          else
            sudo apt-get update
            sudo apt-get install -y mysql-client-core-8.0 || sudo apt-get install -y default-mysql-client
          fi
      - name: Esperar a MySQL
        run: |
          for i in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 -P 3306 -uroot --silent; then echo "MySQL listo"; break; fi
            sleep 2
          done
      - name: Preparar esquema previo (init + prerequisitos)
        run: |
          mysql -h 127.0.0.1 -P 3306 -uroot asistencia < ../database/init.sql
          mysql -h 127.0.0.1 -P 3306 -uroot asistencia < ../database/migrations/012_audit_events.sql
          mysql -h 127.0.0.1 -P 3306 -uroot asistencia < ../database/migrations/015_branches.sql
          # 033 crea system_settings (fuente de verdad); la 083 (FASE E) la usa con
          # INSERT IGNORE. Como esta job BASELINEA hasta 071 (033 no se ejecuta), hay
          # que sembrar su esquema aquí, igual que 012/015/067, o 083 fallaría.
          mysql -h 127.0.0.1 -P 3306 -uroot asistencia < ../database/migrations/033_audit_fulltext.sql
          mysql -h 127.0.0.1 -P 3306 -uroot asistencia < ../database/migrations/067_employee_documents.sql
      - name: Baseline SÓLO hasta 071 (072→ se aplican de verdad)
        run: node scripts/migrate.js --baseline=071_repair_external_hr_sources.sql
      - name: Aplicar (el runner corre 072→ realmente)
        run: node scripts/migrate.js
      - name: 072→075 realmente aplicadas (no baselinadas)
        run: |
          set -e
          for m in \
            072_employee_schedule_history.sql \
            073_workday_profile_and_overlap_guard.sql \
            074_daily_summary_status_unknown.sql \
            075_workday_configuration_phase_c.sql; do
            mysql -N -B -h 127.0.0.1 -P 3306 -uroot asistencia \
              -e "SELECT COUNT(*) FROM schema_migrations WHERE filename='$m'" | grep -q '^1$'
          done
          # 072 creó la tabla y 073/075 sus columnas de perfil.
          mysql -N -B -h 127.0.0.1 -P 3306 -uroot asistencia \
            -e "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema='asistencia' AND table_name='employee_schedule_history' AND column_name='work_regime'" | grep -q '^1$'
          # 074 amplió el ENUM de daily_summary.status.
          mysql -N -B -h 127.0.0.1 -P 3306 -uroot asistencia \
            -e "SELECT column_type FROM information_schema.columns WHERE table_schema='asistencia' AND table_name='daily_summary' AND column_name='status'" | grep -q "unconfigured"
          echo "072→075 aplicadas y presentes en el esquema"
      - name: Reaplicar es idempotente y NO cambia el esquema
        run: |
          set -e
          SEL="SELECT table_name,column_name,column_type,is_nullable,column_default,ordinal_position \
               FROM information_schema.columns WHERE table_schema='asistencia' \
               ORDER BY table_name,ordinal_position"
          mysql -N -B -h 127.0.0.1 -P 3306 -uroot asistencia -e "$SEL" > /tmp/schema_before.txt
          M1=$(mysql -N -B -h 127.0.0.1 -P 3306 -uroot asistencia -e "SELECT COUNT(*) FROM schema_migrations")
          OUT=$(node scripts/migrate.js); echo "$OUT"
          echo "$OUT" | grep -q "Nada por aplicar"
          mysql -N -B -h 127.0.0.1 -P 3306 -uroot asistencia -e "$SEL" > /tmp/schema_after.txt
          M2=$(mysql -N -B -h 127.0.0.1 -P 3306 -uroot asistencia -e "SELECT COUNT(*) FROM schema_migrations")
          diff /tmp/schema_before.txt /tmp/schema_after.txt && echo "ESQUEMA IDÉNTICO tras reaplicar"
          test "$M1" = "$M2" && echo "schema_migrations sin cambios ($M1)"

  # [OPS-7/8] Ejecuta el PROPIO scripts/ops-migrate.sh (el que corre OPS en el
  # server) contra un MySQL 8 efímero, no sólo el runner genérico. Cubre:
  #   · instalación FRESCA (init.sql → ops-migrate.sh) aplica 072→084;
  #   · 084 registrada EXACTAMENTE una vez; forma completa del esquema; NINGUNA
  #     migración por encima del tope 084; 2ª ejecución del script = no-op;
  #   · ACTUALIZACIÓN desde una forma ANTIGUA de 083 (se simula quitando lo que
  #     agrega 084) → ops-migrate.sh aplica 084 y reconcilia la forma.
  ops-migrate-fase-e:
    name: OPS ops-migrate.sh FASE E (fresh + upgrade 083→084)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: asistencia
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: asistencia
      MYSQL_PWD: root
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: api/package-lock.json
      - name: Instalar deps de la API (migrate.js usa mysql2/dotenv)
        working-directory: api
        run: npm ci || npm install
      - name: Asegurar cliente mysql
        run: mysql --version || (sudo apt-get update && sudo apt-get install -y mysql-client-core-8.0 || sudo apt-get install -y default-mysql-client)
      - name: Esperar a MySQL
        run: |
          for i in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 -P 3306 -uroot -proot --silent; then echo "MySQL listo"; break; fi
            sleep 2
          done
      - name: Permitir rutinas con binlog (073/082/084 crean rutinas)
        run: mysql -h 127.0.0.1 -P 3306 -uroot -proot -e "SET GLOBAL log_bin_trust_function_creators=1;"

      - name: Definir verificador de forma reutilizable
        run: |
          cat > /tmp/check_shape.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          Q(){ mysql -N -B -h 127.0.0.1 -P 3306 -uroot -proot asistencia -e "$1"; }
          N=$(Q "SELECT COUNT(*) FROM schema_migrations WHERE filename='084_fase_e_console_shape_reconcile.sql'")
          [ "$N" = "1" ] || { echo "❌ 084 registrada $N veces (esperado 1)"; exit 1; }
          A=$(Q "SELECT COUNT(*) FROM schema_migrations WHERE filename > '084_fase_e_console_shape_reconcile.sql'")
          [ "$A" = "0" ] || { echo "❌ $A migración(es) por encima del tope 084"; exit 1; }
          Q "SELECT COLUMN_TYPE FROM INFORMATION_SCHEMA.COLUMNS WHERE TABLE_SCHEMA='asistencia' AND TABLE_NAME='daily_summary_recalc_batch' AND COLUMN_NAME='status'" | grep -q restored_with_conflicts || { echo "❌ falta el estado restored_with_conflicts"; exit 1; }
          for pair in "daily_summary_recalc_batch:rows_skipped" "daily_summary_backup:applied_json" "fase_e_console_lock:heartbeat_seq"; do
            T="${pair%%:*}"; C="${pair##*:}"
            [ "$(Q "SELECT COUNT(*) FROM INFORMATION_SCHEMA.COLUMNS WHERE TABLE_SCHEMA='asistencia' AND TABLE_NAME='$T' AND COLUMN_NAME='$C'")" = "1" ] || { echo "❌ falta $T.$C"; exit 1; }
          done
          [ "$(Q "SELECT COUNT(*) FROM INFORMATION_SCHEMA.STATISTICS WHERE TABLE_SCHEMA='asistencia' AND TABLE_NAME='daily_summary_backup' AND INDEX_NAME='uq_batch_cell'")" -ge "1" ] || { echo "❌ falta el índice único uq_batch_cell"; exit 1; }
          echo "✓ forma completa + 084 exactamente una vez + nada por encima del tope"
          SH
          chmod +x /tmp/check_shape.sh

      # ── FASE A: instalación FRESCA ──────────────────────────────────────────
      - name: A) init.sql fresco
        run: mysql -h 127.0.0.1 -P 3306 -uroot -proot asistencia < database/init.sql
      - name: A) ops-migrate.sh (fresh) — aplica 072→084 y valida
        run: bash scripts/ops-migrate.sh
      - name: A) verificar forma tras instalación fresca
        run: /tmp/check_shape.sh
      - name: A) 2ª ejecución de ops-migrate.sh = no-op
        run: |
          set -e
          OUT=$(bash scripts/ops-migrate.sh); echo "$OUT"
          echo "$OUT" | grep -q "Nada por aplicar" || { echo "❌ la 2ª corrida no fue no-op"; exit 1; }
          /tmp/check_shape.sh

      # ── FASE B: ACTUALIZACIÓN desde una forma ANTIGUA de 083 ─────────────────
      - name: B) simular 083 aplicada con forma vieja (sin lo que agrega 084)
        run: |
          mysql -h 127.0.0.1 -P 3306 -uroot -proot asistencia <<'SQL'
          ALTER TABLE daily_summary_recalc_batch DROP COLUMN rows_skipped;
          ALTER TABLE daily_summary_recalc_batch
            MODIFY COLUMN status ENUM('prepared','applying','applied','failed','restoring','restored') NOT NULL DEFAULT 'prepared';
          ALTER TABLE daily_summary_backup DROP INDEX uq_batch_cell;
          ALTER TABLE daily_summary_backup DROP COLUMN applied_json;
          ALTER TABLE fase_e_console_lock DROP COLUMN heartbeat_seq;
          DELETE FROM schema_migrations WHERE filename='084_fase_e_console_shape_reconcile.sql';
          SQL
      - name: B) confirmar que la forma quedó INCOMPLETA (084 pendiente)
        run: |
          set -e
          test "$(mysql -N -B -h 127.0.0.1 -P 3306 -uroot -proot asistencia -e "SELECT COUNT(*) FROM schema_migrations WHERE filename='084_fase_e_console_shape_reconcile.sql'")" = "0"
          test "$(mysql -N -B -h 127.0.0.1 -P 3306 -uroot -proot asistencia -e "SELECT COUNT(*) FROM INFORMATION_SCHEMA.COLUMNS WHERE TABLE_SCHEMA='asistencia' AND TABLE_NAME='daily_summary_recalc_batch' AND COLUMN_NAME='rows_skipped'")" = "0"
          echo "✓ forma vieja de 083 simulada (084 pendiente)"
      - name: B) ops-migrate.sh reconcilia (aplica 084) y valida
        run: bash scripts/ops-migrate.sh
      - name: B) verificar forma reconciliada tras la actualización
        run: /tmp/check_shape.sh
