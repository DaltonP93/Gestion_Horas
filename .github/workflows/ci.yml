name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  bridge-tests:
    name: Bridge — tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: bridge/package-lock.json
      - run: npm ci || npm install
      # Tres zonas, no una. El Bridge convierte hora de pared del reloj a
      # instantes, así que la zona del proceso es una entrada real: un runner
      # en UTC no ejerce el caso de producción (America/Asuncion, UTC-4/-3) ni
      # el del otro lado del meridiano, donde la fecha local ya cambió.
      - name: Unit tests (TZ=UTC)
        run: npm test
        env:
          TZ: UTC
      - name: Unit tests (TZ=America/Asuncion)
        run: npm test
        env:
          TZ: America/Asuncion
      - name: Unit tests (TZ=Asia/Tokyo)
        run: npm test
        env:
          TZ: Asia/Tokyo

  api-build:
    name: API — install + syntax
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: api/package-lock.json
      - run: npm ci || npm install
      - name: Syntax check
        run: node --check src/index.js
      - name: Unit tests (TZ=UTC)
        run: npm test
        env:
          TZ: UTC
      - name: Unit tests (TZ=America/Asuncion)
        run: npm test
        env:
          TZ: America/Asuncion
      - name: Unit tests (TZ=Asia/Tokyo)
        run: npm test
        env:
          TZ: Asia/Tokyo

  web-build:
    name: Web — build Next.js
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - run: npm ci || npm install
      - name: Unit tests
        run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
