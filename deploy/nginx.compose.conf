# deploy/nginx.compose.conf
# Config de Nginx para el STACK DOCKER-COMPOSE (self-contained).
#
# Se monta en el servicio `nginx` de docker-compose.yml como
#   /etc/nginx/conf.d/default.conf
# (el nginx.conf base de la imagen `nginx:alpine` ya incluye conf.d/*.conf
# dentro de su bloque http{}, así que aquí sólo va el server{}).
#
# A diferencia de `deploy/nginx-sishoras.conf` (instalación en el HOST, que
# hace proxy a 127.0.0.1 y termina TLS con Let's Encrypt), este archivo hace
# proxy a los NOMBRES DE SERVICIO de compose (web/api/analytics) por la red
# `asistencia_net`. Es HTTP-only: en producción, el TLS lo termina el nginx del
# host (deploy/nginx-sishoras.conf) o un balanceador delante del stack.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Tamaño máximo de uploads (logos, CSV, fotos)
    client_max_body_size 10M;

    # ── FastAPI analytics ─────────────────────────────────────────
    location /api/analytics/ {
        rewrite ^/api/analytics/(.*) /$1 break;
        proxy_pass         http://analytics:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host                $host;
        proxy_set_header   X-Real-IP           $remote_addr;
        proxy_set_header   X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto   $scheme;
        proxy_read_timeout 300s;
    }

    # ── Node API REST ─────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host                $host;
        proxy_set_header   X-Real-IP           $remote_addr;
        proxy_set_header   X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto   $scheme;
        proxy_read_timeout 300s;
    }

    # ── Uploads: sólo la carpeta pública de marca; el resto → 404 ──────────
    # uploads/brand/ recibe ÚNICAMENTE recursos de marca subidos desde
    # Apariencia (logo, favicon, ícono PWA, fondo del login): se publica con
    # nombre de un solo segmento y extensión de imagen, reescrito a la ruta
    # canónica y sólo GET. Todo lo demás bajo /uploads/ responde 404 ACÁ, sin
    # llegar a la API: fotos, firmas y sellos (aunque tengan nombre numérico),
    # selfies, documentos, justificativos y carpetas nuevas o desconocidas.
    # No depende del código de la API: se mantiene si se vuelve a una versión
    # anterior. Los logos heredados de la raíz se sirven por la API
    # (/api/settings/brand/:kind). Lo privado: sólo /api/... autenticado.
    location ~ ^/uploads/brand/(?<brand_file>[A-Za-z0-9_-]+\.(?:png|jpg|jpeg|webp|gif|ico|svg))$ {
        limit_except GET { deny all; }
        rewrite ^ /uploads/brand/$brand_file break;
        proxy_pass         http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_no_cache     1;
        proxy_cache_bypass 1;
    }
    location /uploads/ {
        add_header Cache-Control "no-store" always;
        return 404;
    }

    # ── WebSocket Socket.io ───────────────────────────────────────
    location /socket.io/ {
        proxy_pass             http://api:4000;
        proxy_http_version     1.1;
        proxy_set_header       Upgrade            $http_upgrade;
        proxy_set_header       Connection         "upgrade";
        proxy_set_header       Host               $host;
        proxy_set_header       X-Real-IP          $remote_addr;
        proxy_set_header       X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto  $scheme;
        proxy_read_timeout     3600s;
        proxy_send_timeout     3600s;
        proxy_cache_bypass     $http_upgrade;
    }

    # ── Dashboard Next.js ─────────────────────────────────────────
    location / {
        proxy_pass         http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host                $host;
        proxy_set_header   X-Real-IP           $remote_addr;
        proxy_set_header   X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto   $scheme;
    }
}
